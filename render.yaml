databases:
  - name: lms-db
    plan: free
    databaseName: lms_db
    user: lms_user

services:
  - type: web
    name: library-management-system
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn lms.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
